<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>

    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="index.html">
                <img src="img/Cecyto.png" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>

    <br><br>

    <div class="container p-4 bg-info mt-5 card">

        <h1 class="text-center">
            <i class="bi bi-stars"></i>
            SIGNOS ZODIACALES
        </h1>

        <hr>

        <div class="row">

            <div class="col-md-6">

                <h5 id="valorDia">DIA 1</h5>

                <input
                    type="range"
                    class="form-range"
                    id="dia"
                    min="1"
                    max="31"
                    value="1">

                <br>

                <h5>MES</h5>

                <select class="form-select" id="mes">

                    <option value="ENERO">ENERO</option>
                    <option value="FEBRERO">FEBRERO</option>
                    <option value="MARZO">MARZO</option>
                    <option value="ABRIL">ABRIL</option>
                    <option value="MAYO">MAYO</option>
                    <option value="JUNIO">JUNIO</option>
                    <option value="JULIO">JULIO</option>
                    <option value="AGOSTO">AGOSTO</option>
                    <option value="SEPTIEMBRE">SEPTIEMBRE</option>
                    <option value="OCTUBRE">OCTUBRE</option>
                    <option value="NOVIEMBRE">NOVIEMBRE</option>
                    <option value="DICIEMBRE">DICIEMBRE</option>

                </select>

                <h2 id="fecha" class="text-center mt-4">
                    1 de ENERO
                </h2>

                <h1 id="signo" class="text-center text-danger mt-4">
                    CAPRICORNIO
                </h1>

            </div>

            <div class="col-md-6 text-center">

                <img
                    id="imgSigno"
                    src="img/10Capricornio.jpeg"
                    class="img-fluid rounded shadow"
                    width="350">

            </div>

        </div>

    </div>

    <br><br>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="JS/04signos.js"></script>

</body>
</html>
